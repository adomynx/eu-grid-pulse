<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1040" font-family="Segoe UI, system-ui, -apple-system, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .title{font-size:34px;font-weight:700;fill:#0f172a}
      .sub{font-size:16px;fill:#64748b}
      .h{font-size:20px;font-weight:700;fill:#0f172a}
      .d{font-size:14px;fill:#475569}
      .lbl{font-size:13px;font-style:italic;fill:#64748b}
      .chip{font-size:14px;fill:#334155}
      .cap{font-size:13px;font-weight:700;fill:#94a3b8;letter-spacing:2px}
      .flow{stroke:#94a3b8;stroke-width:2;fill:none}
    </style>
  </defs>

  <!-- card -->
  <rect x="10" y="10" width="1220" height="1020" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <!-- heading -->
  <text x="620" y="60" text-anchor="middle" class="title">EU Grid Pulse — Data Pipeline Architecture</text>
  <text x="620" y="92" text-anchor="middle" class="sub">Batch ELT · ENTSO-E API → DuckDB star schema → Power BI · tested, orchestrated &amp; scheduled</text>

  <!-- Dagster orchestration enclosure -->
  <rect x="40" y="124" width="700" height="800" rx="16" fill="#7c3aed" fill-opacity="0.04" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 6"/>
  <rect x="58" y="110" width="486" height="30" rx="15" fill="#7c3aed"/>
  <text x="74" y="130" font-size="14" font-weight="700" fill="#ffffff">◆ Dagster — asset graph + daily 06:00 schedule (orchestrates every step)</text>

  <!-- helper: each box = accent bar + panel -->
  <!-- API -->
  <rect x="72" y="156" width="640" height="86" rx="12" fill="#ecfeff" stroke="#14b8a6" stroke-width="1.5"/>
  <rect x="72" y="156" width="9" height="86" rx="4" fill="#14b8a6"/>
  <text x="96" y="192" class="h">ENTSO-E Transparency API</text>
  <text x="96" y="218" class="d">Actual load + generation-by-fuel-type, per country &#160;·&#160; synthetic fallback (no token)</text>

  <path class="flow" d="M392 242 L392 280" marker-end="url(#ar)"/>
  <text x="408" y="266" class="lbl">Python extract · incremental + idempotent (watermark)</text>

  <!-- RAW -->
  <rect x="72" y="282" width="640" height="82" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <rect x="72" y="282" width="9" height="82" rx="4" fill="#64748b"/>
  <text x="96" y="316" class="h">DuckDB · RAW</text>
  <text x="96" y="342" class="d">raw_load, raw_generation — landed as-is, replayable</text>

  <path class="flow" d="M392 364 L392 402" marker-end="url(#ar)"/>
  <text x="408" y="388" class="lbl">dbt · UTC · MW · de-dup · nulls</text>

  <!-- STAGING -->
  <rect x="72" y="404" width="640" height="82" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <rect x="72" y="404" width="9" height="82" rx="4" fill="#6366f1"/>
  <text x="96" y="438" class="h">dbt · STAGING</text>
  <text x="96" y="464" class="d">stg_load, stg_generation — cleaned &amp; harmonised to one UTC grain</text>

  <path class="flow" d="M392 486 L392 524" marker-end="url(#ar)"/>
  <text x="408" y="510" class="lbl">dbt · build dimensions + facts</text>

  <!-- MARTS -->
  <rect x="72" y="526" width="640" height="120" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <rect x="72" y="526" width="9" height="120" rx="4" fill="#10b981"/>
  <text x="96" y="560" class="h">dbt · MARTS — star schema</text>
  <text x="96" y="588" class="d">facts: fact_load · fact_generation</text>
  <text x="96" y="612" class="d">dims: dim_date · dim_country · dim_fuel (is_renewable flag)</text>

  <path class="flow" d="M392 646 L392 698" marker-end="url(#ar)"/>
  <text x="408" y="678" class="lbl">star schema, keys aligned</text>

  <!-- SERVING -->
  <rect x="72" y="700" width="640" height="110" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="72" y="700" width="9" height="110" rx="4" fill="#f59e0b"/>
  <text x="96" y="734" class="h">Serving — BI &amp; dashboards</text>
  <text x="96" y="762" class="d">Power BI · PBIP as code (TMDL model + 21 DAX measures)</text>
  <text x="96" y="786" class="d">Interactive HTML dashboard (renewable share · fuel mix · demand curves)</text>

  <!-- Data Quality (right) -->
  <path class="flow" d="M712 567 L768 567" marker-end="url(#ar)"/>
  <text x="724" y="556" class="lbl">each build</text>
  <rect x="770" y="526" width="420" height="120" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="770" y="526" width="9" height="120" rx="4" fill="#f59e0b"/>
  <text x="794" y="560" class="h">Data Quality — 31 dbt tests</text>
  <text x="794" y="588" class="d">not-null · unique · relationships</text>
  <text x="794" y="612" class="d">accepted-values · plausibility</text>

  <text x="770" y="676" font-size="13" font-style="italic" fill="#b45309">Surface as Dagster asset checks.</text>
  <text x="770" y="696" font-size="13" font-style="italic" fill="#b45309">A failure fails the run — bad data never reaches BI.</text>

  <!-- stack -->
  <text x="620" y="958" text-anchor="middle" class="cap">STACK</text>
  <g>
    <rect x="186" y="972" width="86"  height="30" rx="15" fill="#f1f5f9" stroke="#e2e8f0"/><text x="229"  y="992" text-anchor="middle" class="chip">Python</text>
    <rect x="286" y="972" width="150" height="30" rx="15" fill="#f1f5f9" stroke="#e2e8f0"/><text x="361"  y="992" text-anchor="middle" class="chip">pandas · NumPy</text>
    <rect x="450" y="972" width="110" height="30" rx="15" fill="#f1f5f9" stroke="#e2e8f0"/><text x="505"  y="992" text-anchor="middle" class="chip">entsoe-py</text>
    <rect x="574" y="972" width="100" height="30" rx="15" fill="#f1f5f9" stroke="#e2e8f0"/><text x="624"  y="992" text-anchor="middle" class="chip">DuckDB</text>
    <rect x="688" y="972" width="64"  height="30" rx="15" fill="#f1f5f9" stroke="#e2e8f0"/><text x="720"  y="992" text-anchor="middle" class="chip">dbt</text>
    <rect x="766" y="972" width="96"  height="30" rx="15" fill="#f1f5f9" stroke="#e2e8f0"/><text x="814"  y="992" text-anchor="middle" class="chip">Dagster</text>
    <rect x="876" y="972" width="104" height="30" rx="15" fill="#f1f5f9" stroke="#e2e8f0"/><text x="928"  y="992" text-anchor="middle" class="chip">Power BI</text>
    <rect x="994" y="972" width="60"  height="30" rx="15" fill="#f1f5f9" stroke="#e2e8f0"/><text x="1024" y="992" text-anchor="middle" class="chip">Git</text>
  </g>
</svg>
